services:
  # Base de datos MySQL
  mysql-db:
    image: mysql:8.0
    container_name: vetcore_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vetcore_db
      MYSQL_USER: vetcore_user
      MYSQL_PASSWORD: vetcore_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vetcore-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Servicio de Autenticación
  auth-service:
    build:
      context: ../vetcore_auth_msvc
      dockerfile: Dockerfile
    container_name: vetcore_auth_service
    restart: always
    environment:
      PORT: 3000
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: vetcore_db
      DB_USER: vetcore_user
      DB_PASSWORD: vetcore_pass
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production
      JWT_EXPIRES_IN: 24h
    ports:
      - "3000:3000"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - vetcore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API Gateway
  api-gateway:
    build:
      context: ../vetcore_apigateway_msvc
      dockerfile: Dockerfile
    container_name: vetcore_api_gateway
    restart: always
    environment:
      PORT: 8000
      AUTH_SERVICE_URL: http://auth-service:3000
      CORS_ORIGIN: "*"
      NODE_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
    networks:
      - vetcore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  vetcore-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
