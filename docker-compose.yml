services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vetcore_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: vetcore
      RABBITMQ_DEFAULT_PASS: vetcore_pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - vetcore-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 2s
      retries: 20

  # Base de datos MySQL para Auth Service
  mysql-auth-db:
    image: mysql:8.0
    container_name: vetcore_mysql_auth
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vetcore_auth_db
      MYSQL_USER: vetcore_auth_user
      MYSQL_PASSWORD: vetcore_pass
    ports:
      - "3308:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql
    networks:
      - vetcore-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Base de datos MySQL para Patients Service
  mysql-patients-db:
    image: mysql:8.0
    container_name: vetcore_mysql_patients
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vetcore_patients_db
      MYSQL_USER: vetcore_patients_user
      MYSQL_PASSWORD: vetcore_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_patients_data:/var/lib/mysql
    networks:
      - vetcore-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Base de datos MySQL para Appointments Service
  mysql-appointments-db:
    image: mysql:8.0
    container_name: vetcore_mysql_appointments
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vetcore_appointments_db
      MYSQL_USER: vetcore_appointments_user
      MYSQL_PASSWORD: vetcore_pass
    ports:
      - "3309:3306"
    volumes:
      - mysql_appointments_data:/var/lib/mysql
    networks:
      - vetcore-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Servicio de Autenticación
  auth-service:
    image: vetcore/auth-service:latest
    container_name: vetcore_auth_service
    restart: always
    environment:
      PORT: 3000
      DB_HOST: mysql-auth-db
      DB_PORT: 3306
      DB_NAME: vetcore_auth_db
      DB_USER: vetcore_auth_user
      DB_PASSWORD: vetcore_pass
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production
      JWT_EXPIRES_IN: 24h
      RABBITMQ_URL: amqp://vetcore:vetcore_pass@rabbitmq:5672
    ports:
      - "3000:3000"
    depends_on:
      mysql-auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vetcore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Servicio de Pacientes
  patients-service:
    image: vetcore/patients-service:latest
    container_name: vetcore_patients_service
    restart: always
    environment:
      PORT: 3001
      DB_HOST: mysql-patients-db
      DB_PORT: 3306
      DB_NAME: vetcore_patients_db
      DB_USER: vetcore_patients_user
      DB_PASSWORD: vetcore_pass
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production
      JWT_EXPIRES_IN: 24h
      AUTH_SERVICE_URL: http://auth-service:3000
    ports:
      - "3001:3001"
    depends_on:
      mysql-patients-db:
        condition: service_healthy
    networks:
      - vetcore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Servicio de Citas
  appointments-service:
    image: vetcore/appointments-service:latest
    container_name: vetcore_appointments_service
    restart: always
    environment:
      PORT: 3003
      DB_HOST: mysql-appointments-db
      DB_PORT: 3306
      DB_NAME: vetcore_appointments_db
      DB_USER: vetcore_appointments_user
      DB_PASSWORD: vetcore_pass
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production
      JWT_EXPIRES_IN: 24h
      AUTH_SERVICE_URL: http://auth-service:3000
      PATIENTS_SERVICE_URL: http://patients-service:3001
      RABBITMQ_URL: amqp://vetcore:vetcore_pass@rabbitmq:5672
    ports:
      - "3003:3003"
    depends_on:
      mysql-appointments-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vetcore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3003/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API Gateway
  api-gateway:
    image: vetcore/api-gateway:latest
    container_name: vetcore_api_gateway
    restart: always
    environment:
      PORT: 8000
      AUTH_SERVICE_URL: http://auth-service:3000
      PATIENTS_SERVICE_URL: http://patients-service:3001
      APPOINTMENTS_SERVICE_URL: http://appointments-service:3003
      SCHEDULE_SERVICE_URL: http://schedule-query-msvc:8082
      CORS_ORIGIN: "*"
      NODE_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - patients-service
      - appointments-service
    networks:
      - vetcore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servicio de Notificaciones
  notifications-service:
    image: vetcore/notifications-service:latest
    container_name: vetcore_notifications_service
    restart: always
    environment:
      PORT: 3002
      NODE_ENV: production
      RABBITMQ_URL: amqp://vetcore:vetcore_pass@rabbitmq:5672
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_USER: tu correo
      SMTP_PASS: tu clave de aplicacion
      EMAIL_FROM: tu correo
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3002:3002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - vetcore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3002/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # === PostgreSQL para schedule-query-msvc ===
  postgres-db:
    image: postgres:17.5
    container_name: schedule_postgres_dev
    restart: always
    environment:
      POSTGRES_DB: vet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vetcore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vet"]
      interval: 10s
      timeout: 5s
      retries: 10

  # === schedule-query-msvc ===
  schedule-query-msvc:
    build:
      context: ../ScheduleQueryMSVC/
      dockerfile: Dockerfile
    container_name: schedule_query_dev
    restart: always
    ports:
      - "8082:8082"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres-db:5432/vet
      JDBC_DATABASE_USERNAME: postgres
      JDBC_DATABASE_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: vetcore
      RABBITMQ_PASSWORD: vetcore_pass
      TZ: America/Bogota
      PORT: 8082
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vetcore-network

networks:
  vetcore-network:
    driver: bridge
  schedule-network:
    driver: bridge

volumes:
  mysql_auth_data:
    driver: local
  mysql_patients_data:
    driver: local
  mysql_appointments_data:
    driver: local
  rabbitmq_data:
    driver: local
  postgres_data:
    driver: local
